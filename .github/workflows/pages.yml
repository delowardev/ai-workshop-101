name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      # GitHub Pages is static hosting, so the API routes can't run there.
      # The static build runs the cart in the browser instead (src/lib/client-api.ts).
      - name: Remove API routes for the static build
        run: rm -rf src/app/api
      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_STATIC_DEMO: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
