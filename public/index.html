<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickCart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>QuickCart</h1>
    <p>Free shipping on orders of $50.00 or more.</p>
  </header>

  <main>
    <section aria-labelledby="products-heading">
      <h2 id="products-heading">Products</h2>
      <ul id="products" data-testid="products"></ul>
    </section>

    <section aria-labelledby="cart-heading">
      <h2 id="cart-heading">Your cart</h2>
      <p id="empty" data-testid="cart-empty">Your cart is empty.</p>
      <table id="cart" data-testid="cart" hidden>
        <thead><tr><th>Item</th><th>Qty</th><th>Price</th><th></th></tr></thead>
        <tbody></tbody>
      </table>

      <form id="discount-form" data-testid="discount-form">
        <label for="discount-code">Discount code</label>
        <input id="discount-code" name="code" data-testid="discount-input" autocomplete="off">
        <button type="submit" data-testid="discount-apply">Apply</button>
      </form>
      <p id="message" role="status" data-testid="message"></p>

      <dl class="totals">
        <dt>Subtotal</dt><dd data-testid="subtotal">$0.00</dd>
        <dt>Discount</dt><dd data-testid="discount">$0.00</dd>
        <dt>Shipping</dt><dd data-testid="shipping">$0.00</dd>
        <dt class="total">Total</dt><dd class="total" data-testid="total">$0.00</dd>
      </dl>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
